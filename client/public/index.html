<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>Gab-AI</title>
  <style>
    #splash {
      position: fixed; inset: 0;
      background: linear-gradient(145deg, #0D1B2E 0%, #152540 50%, #1E3A5F 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.4s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash svg { width: 72px; height: 72px; filter: drop-shadow(0 0 20px rgba(232,181,42,0.4)); animation: pulse 1.5s ease-in-out infinite; }
    #splash .name { font-size: 38px; font-weight: 800; color: #fff; letter-spacing: -0.03em; margin-top: 16px; font-family: -apple-system, sans-serif; }
    #splash .ai { background: linear-gradient(135deg, #E8B52A, #F5D87A); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #splash .tag { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 6px; font-family: -apple-system, sans-serif; letter-spacing: 0.08em; }
    #splash .dots { display: flex; gap: 6px; margin-top: 40px; }
    #splash .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(232,181,42,0.6); animation: bounce 1.2s ease-in-out infinite; }
    #splash .dot:nth-child(2) { animation-delay: 0.2s; }
    #splash .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
    @keyframes bounce { 0%,100%{transform:translateY(0);opacity:0.4} 50%{transform:translateY(-6px);opacity:1} }
  </style>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gab-AI">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0D1B2E">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <noscript>יש להפעיל JavaScript</noscript>
    <div id="splash">
    <img src="/logo-transparent.png" alt="Gab-AI" style="width:140px;height:140px;object-fit:contain;animation:pulse 1.5s ease-in-out infinite;" />
    <div class="name">Gab<span class="ai">-AI</span></div>
    <div class="tag">מערכת ניהול בית כנסת</div>
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        var s = document.getElementById('splash');
        if (s) { s.classList.add('hide'); setTimeout(function(){ s.remove(); }, 400); }
      }, 800);
    });
  </script>
  <div id="root"></div>
</body>
</html>
